<path id="sc-lt" d="M166.229,200.613 L118.534,234.000 L166.229,267.387 A6.575,6.575 0 0 0 173.771,256.613 L141.466,234.000 L173.771,211.387 A6.575,6.575 0 0 0 166.229,200.613 Z"/>
<path id="sc-slash" d="M212.931,190.001 L184.931,275.001 A6.390,6.390 0 0 0 197.069,278.999 L225.069,193.999 A6.390,6.390 0 0 0 212.931,190.001 Z"/>
<path id="sc-gt" d="M233.282,211.445 L266.309,234.000 L233.282,256.555 A6.593,6.593 0 0 0 240.718,267.445 L289.691,234.000 L240.718,200.555 A6.593,6.593 0 0 0 233.282,211.445 Z"/>
  </g>
</svg>
