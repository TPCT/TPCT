<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Islam Elsayed: Founder @ ShiftCodes, Systems Architect, Senior Full-Stack Engineer</title>
  <desc id="desc">Profile banner for Islam Elsayed (TPCT), Alexandria, Egypt.</desc>
  <defs>
    <linearGradient id="accent"><stop stop-color="#6E2BFB"/><stop offset=".55" stop-color="#5A1FE0"/><stop offset="1" stop-color="#3346C4"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7B3FFF"/><stop offset=".5" stop-color="#6E2BFB"/><stop offset="1" stop-color="#5A1FE0"/></linearGradient>
    <linearGradient id="field" x2="1" y2="1"><stop stop-color="#F3F0FD"/><stop offset="1" stop-color="#E7E3F7"/></linearGradient>
    <clipPath id="plate"><rect x=".5" y=".5" width="999" height="319" rx="20"/></clipPath>
    <radialGradient id="field-a"><stop stop-color="#E4DAFF" stop-opacity=".9"/><stop offset="1" stop-color="#E4DAFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="field-b"><stop stop-color="#DCE2FF" stop-opacity=".9"/><stop offset="1" stop-color="#DCE2FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-a"><stop stop-color="#6E2BFB" stop-opacity=".28"/><stop offset="1" stop-color="#6E2BFB" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-b"><stop stop-color="#3346C4" stop-opacity=".18"/><stop offset="1" stop-color="#3346C4" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .sans { font-family: Outfit, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: no-preference) {
      #sc-hook-top, #sc-hook-bottom, #sc-lt, #sc-gt, #sc-slash { transform-box: fill-box; transform-origin: center; }
      #sc-hook-top { animation: top-in 900ms ease-out 350ms backwards, top-drift 7s ease-in-out 1950ms infinite alternate; }
      #sc-hook-bottom { animation: bottom-in 900ms ease-out 470ms backwards, bottom-drift 7s ease-in-out 1950ms infinite alternate; }
      #sc-lt { animation: lt-in 420ms ease-out 950ms backwards; }
      #sc-gt { animation: gt-in 420ms ease-out 1050ms backwards; }
      #sc-slash { animation: slash-in 420ms ease-out 1150ms backwards, cursor 1.6s ease-in-out 1950ms infinite; }
      @keyframes top-in { from { transform: translate(48px, -40px) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes bottom-in { from { transform: translate(-48px, 40px) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes lt-in { from { transform: translateX(14px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes gt-in { from { transform: translateX(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes slash-in { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes top-drift { to { transform: translate(5px, -4px); } }
      @keyframes bottom-drift { to { transform: translate(-5px, 4px); } }
      @keyframes cursor { 50% { opacity: .55; } }
    }
  </style>
  <rect x=".5" y=".5" width="999" height="319" rx="20" fill="#EEEBFA"/>
  <g clip-path="url(#plate)">
    <rect width="1000" height="320" fill="url(#field)"/>
    <ellipse cx="180" cy="20" rx="500" ry="290" fill="url(#field-a)"/>
    <ellipse cx="920" cy="128" rx="500" ry="290" fill="url(#field-b)"/>
    <circle cx="790" cy="160" r="128" fill="#FCFBFF" stroke="#D8D1F0" stroke-opacity=".5"/>
    <ellipse cx="755" cy="150" rx="155" ry="140" fill="url(#glow-a)"/>
    <ellipse cx="840" cy="175" rx="150" ry="130" fill="url(#glow-b)"/>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="20" fill="none" stroke="#D8D1F0"/>
  <text id="t-label" x="56" y="76" class="sans" font-size="16" font-weight="800" fill="#3346C4" letter-spacing="1.5">TPCT · ALEXANDRIA, EGYPT</text>
  <text id="t-name" x="56" y="156" class="sans" font-size="72" font-weight="800" fill="url(#accent)" letter-spacing="-1.5">Islam Elsayed</text>
  <rect x="56" y="180" width="96" height="6" rx="3" fill="url(#accent)"/>
  <text id="t-role1" x="56" y="232" class="sans" font-size="30" font-weight="600" fill="#1C1530">Founder @ ShiftCodes</text>
  <text id="t-role2" x="56" y="270" class="sans" font-size="22" fill="#5A5275">Systems Architect · Senior Full-Stack Engineer</text>
