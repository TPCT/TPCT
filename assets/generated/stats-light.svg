<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img">
<title>GitHub stats for TPCT</title>
<defs><linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="960" y2="0"><stop offset="0%" stop-color="#6E2BFB"/><stop offset="55%" stop-color="#5A1FE0"/><stop offset="100%" stop-color="#3346C4"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="999" height="319" rx="20" fill="#FCFBFF" stroke="#D8D1F0"/>
