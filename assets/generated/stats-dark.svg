<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img">
<title>GitHub stats for TPCT</title>
<defs><linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="960" y2="0"><stop offset="0%" stop-color="#C9B8FF"/><stop offset="50%" stop-color="#8A5BFF"/><stop offset="100%" stop-color="#8FA0FF"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="999" height="319" rx="20" fill="#1E1832" stroke="#3A3160"/>
