<style>
@media (prefers-reduced-motion: no-preference) {
.draw { stroke-dasharray: 100 100; stroke-dashoffset: 0; animation: draw 1.6s ease-out backwards; }
.entry { animation: enter 500ms ease-out backwards; }
.ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite backwards; }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.65; transform: scale(1.3); } }
}
</style>
